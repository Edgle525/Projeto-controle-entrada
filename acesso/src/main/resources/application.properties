# Nome do projeto
spring.application.name=acesso

# Conexão com o Banco (Igual ao Passo 1)
spring.datasource.url=jdbc:mysql://localhost:3306/controle_acesso?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Configurações do JPA (Para criar SQL sozinho)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect